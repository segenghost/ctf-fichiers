<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portail — SGS-WEB-001</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f2f5f9; margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { background: white; padding: 2rem; border-radius: 14px; width: min(90%, 360px); box-shadow: 0 8px 28px #17203318; }
    h1 { margin-top: 0; }
    label { display: block; margin-top: 1rem; }
    input { box-sizing: border-box; width: 100%; padding: .7rem; margin-top: .35rem; }
    button { margin-top: 1.2rem; padding: .7rem 1rem; width: 100%; cursor: pointer; }
    p { color: #4b5563; }
  </style>
</head>
<body>
  <main>
    <h1>Portail de connexion</h1>
    <p>Portail de démonstration interne.</p>
    <form>
      <label>Identifiant <input type="text" name="username" autocomplete="off"></label>
      <label>Mot de passe <input type="password" name="password"></label>
      <button type="button" onclick="alert('Démo : aucune authentification n’est effectuée.')">Se connecter</button>
    </form>
  </main>
</body>
</html>
